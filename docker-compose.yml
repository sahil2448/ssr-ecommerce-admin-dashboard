# ============================================================
# DOCKER-COMPOSE.YML — Production-like Local Testing
# Purpose: Build and run the production Docker image locally.
#           This mimics what will run on AWS, so you can
#           test everything before deployment.
#
# Usage:
#   docker compose up --build
#
# This will:
#   1. Build the multi-stage Dockerfile
#   2. Start the container with your .env variables
#   3. Serve the app at http://localhost:3000
# ============================================================

services:
  app:
    # Build the production Dockerfile (multistage)
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* variables must be passed at build time
        # because Next.js inlines them into the JS bundle
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

    # Map host port 3000 to container port 3000
    ports:
      - "3000:3000"

    # Pass environment variables from your .env file at runtime
    # These are NOT baked into the image (except NEXT_PUBLIC_*)
    env_file:
      - .env

    # Optional: restart policy (useful if the app crashes)
    restart: unless-stopped