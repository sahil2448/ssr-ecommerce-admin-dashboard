name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ssr123.azurecr.io
  IMAGE_NAME: ssr-admin-app
  CONTAINER_APP: ssr-admin-app
  RESOURCE_GROUP: ssr_admin_dashboard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sign in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.ACA_APP_URL }}

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy the image WITHOUT runtime env vars in the action.
      # Passing them here makes the action call `az containerapp up`
      # with a giant --env-vars argument that exceeds the OS limit
      # ("Argument list too long" / exit code 126).
      - name: Deploy image to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ssr123
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          containerAppName: ${{ env.CONTAINER_APP }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
          ingress: external
          targetPort: 3000
          disableTelemetry: true

      # Set runtime env vars directly with the Azure CLI afterwards.
      # This avoids the deploy action's internal env-var string build-up
      # that caused E2BIG. Values come from GitHub Actions secrets.
      # Required for boot: MONGODB_URI, AUTH_SECRET, NEXTAUTH_URL.
      # The rest are optional feature config (OAuth, S3, AI) -
      # kept to match your local .env settings.
      - name: Configure runtime environment variables
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --set-env-vars \
              "MONGODB_URI=${{ secrets.MONGODB_URI }}" \
              "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" \
              "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
              "NEXTAUTH_URL=${{ secrets.ACA_APP_URL }}" \
              "NEXT_PUBLIC_APP_URL=${{ secrets.ACA_APP_URL }}" \
              "GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}" \
              "GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}" \
              "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
              "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              "AWS_REGION=${{ secrets.AWS_REGION }}" \
              "AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}" \
              "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" \
              "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}"

      # Force at least 1 warm replica. Azure Container Apps scales
      # to 0 when idle (minReplicas=0), so requests fail cold-start
      # activation and ACA serves its default placeholder page instead
      # of the app. A minimum of 1 replica guarantees the app responds.
      - name: Ensure at least 1 warm replica
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --min-replicas 1

      # Point the health probe at /api/health (a lightweight endpoint that
      # returns 200 immediately, no DB, no middleware). The default probe
      # hits "/" which triggers NextAuth middleware and can be slow/fail,
      # causing ACA to mark the replica "degraded" and serve the welcome page.
      - name: Configure health probe to /api/health
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --health-probe '{"path":"/api/health","port":3000,"type":"liveness","initialDelaySeconds":3,"periodSeconds":10,"failureThreshold":3}'

      - name: Show container logs (diagnostics)
        if: always()
        continue-on-error: true
        run: |
          az containerapp logs show \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --type console --tail 50