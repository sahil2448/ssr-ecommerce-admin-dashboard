# ============================================================
# DOCKER-COMPOSE.DEV.YML — Development with Hot Reload
# Purpose: Run the Next.js app in development mode inside a
#          Docker container with live code reloading.
#
# Key features:
#   - Volume mounts: your local source code is mounted into
#     the container. Any change you make locally is instantly
#     reflected inside the container (hot reload works).
#   - node_modules is excluded from the mount (uses the one
#     installed inside the image for performance).
#   - .env file is loaded for environment variables.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# Access the app at: http://localhost:3000
# ============================================================

services:
  app:
    # Build the development Dockerfile
    build:
      context: .
      dockerfile: Dockerfile.dev

    # Map host port 3000 to container port 3000
    ports:
      - "3000:3000"

    # Mount local source code into the container
    # This enables hot reload: edit files locally, see changes instantly
    volumes:
      # Mount the entire project directory into /app
      - .:/app
      # BUT exclude node_modules from the mount (use the container's own)
      # This prevents overwriting the container's node_modules with your
      # local (possibly different) node_modules
      - /app/node_modules
      # Also exclude .next to avoid permission issues
      - /app/.next

    # Pass environment variables from your .env file
    env_file:
      - .env

    # Set environment to development
    environment:
      - NODE_ENV=development